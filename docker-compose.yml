# /srv/application/docker-compose.yml  — développement local
#
# Données persistées dans ./data/ (bind mounts locaux) :
#   ./data/mysql/    ← MariaDB
#   ./data/redis/    ← Redis
#
# Usage :
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down

networks:
    parapente-internal:
        internal: true
    parapente-external:
        internal: false

services:
    # ────────────────────────────────────────────
    # MariaDB 10.11
    # ────────────────────────────────────────────
    parapente-mariadb:
        image: mariadb:10.11
        command:
            - --max_allowed_packet=512M
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        container_name: parapente_mariadb
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        ports:
            - "3307:3306"
        networks:
            - parapente-internal
            - parapente-external
        volumes:
            - ./data/mysql:/var/lib/mysql
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ────────────────────────────────────────────
    # phpMyAdmin (dev uniquement)
    # ────────────────────────────────────────────
    parapente-phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: parapente_phpmyadmin
        environment:
            PMA_HOST: parapente-mariadb
            PMA_PORT: 3306
        depends_on:
            parapente-mariadb:
                condition: service_healthy
        ports:
            - "8081:80"
        networks:
            - parapente-internal
            - parapente-external

    # ────────────────────────────────────────────
    # Nginx
    # ────────────────────────────────────────────
    parapente-nginx:
        image: nginx:1.26-alpine
        container_name: parapente_nginx
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/log:/var/log/nginx/
            - ./src:/var/www/html:rw
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        ports:
            - "8001:80"
            - "8443:443"
        networks:
            - parapente-internal
            - parapente-external
        depends_on:
            - parapente-php

    # ────────────────────────────────────────────
    # PHP 8.4 FPM
    # ────────────────────────────────────────────
    parapente-php:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                HOST_UID: ${HOST_UID:-1000}
                HOST_GID: ${HOST_GID:-1000}
        container_name: parapente_php
        volumes:
            - ./src:/var/www/html:rw
            - ./storage:/var/www/storage:rw
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        ports:
            - "6001:9003"    # Xdebug
        networks:
            - parapente-internal
            - parapente-external
        depends_on:
            parapente-mariadb:
                condition: service_healthy
            parapente-redis:
                condition: service_healthy
        environment:
            - APP_ENV=${APP_ENV:-local}
            - XDEBUG_MODE=${XDEBUG_MODE:-develop,debug}

    # ────────────────────────────────────────────
    # Laravel Queue Worker
    # ────────────────────────────────────────────
    parapente-worker:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: parapente_worker
        command: php artisan queue:work redis --queue=meteo,default --sleep=3 --tries=3 --timeout=300
        volumes:
            - ./src:/var/www/html:rw
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        networks:
            - parapente-internal
            - parapente-external
        depends_on:
            parapente-mariadb:
                condition: service_healthy
            parapente-redis:
                condition: service_healthy
        restart: unless-stopped

    # ────────────────────────────────────────────
    # Laravel Scheduler
    # ────────────────────────────────────────────
    parapente-scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: parapente_scheduler
        command: php artisan schedule:work
        volumes:
            - ./src:/var/www/html:rw
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        networks:
            - parapente-internal
            - parapente-external
        depends_on:
            parapente-mariadb:
                condition: service_healthy
            parapente-redis:
                condition: service_healthy
        restart: unless-stopped

    # ────────────────────────────────────────────
    # Redis
    # ────────────────────────────────────────────
    parapente-redis:
        image: redis:7-alpine
        container_name: parapente_redis
        volumes:
            - ./data/redis:/data
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        networks:
            - parapente-internal
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ────────────────────────────────────────────
    # MailDev (dev uniquement)
    # ────────────────────────────────────────────
    parapente-mail:
        image: maildev/maildev
        container_name: parapente_maildev
        ports:
            - "6082:1080"
            - "1026:1025"
        networks:
            - parapente-internal
            - parapente-external