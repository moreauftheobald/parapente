networks:
    parapente-internal-pod:
        internal: true
    parapente-external-pod:
        internal: false

volumes:
    mariadb-parapente:
        external: false
    redis-parapente:
        external: false

services:

    # ──────────────────────────────────────────
    # MariaDB 10.11
    # ──────────────────────────────────────────
    parapente-mariadb:
        image: mariadb:10.11
        command:
            - --max_allowed_packet=512M
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        container_name: parapente_mariadb
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        ports:
            - "3307:3306"          # 3307 pour éviter le conflit avec Dolibarr (3306)
        networks:
            - parapente-internal-pod
            - parapente-external-pod
        volumes:
            - mariadb-parapente:/var/lib/mysql
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ──────────────────────────────────────────
    # phpMyAdmin
    # ──────────────────────────────────────────
    parapente-phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: parapente_phpmyadmin
        environment:
            PMA_HOST: parapente-mariadb
            PMA_PORT: 3306
        depends_on:
            parapente-mariadb:
                condition: service_healthy
        ports:
            - "8081:80"            # 8081 pour éviter le conflit avec Dolibarr (8080)
        networks:
            - parapente-internal-pod
            - parapente-external-pod

    # ──────────────────────────────────────────
    # Nginx
    # ──────────────────────────────────────────
    parapente-nginx:
        image: nginx:1.26-alpine
        container_name: parapente_nginx
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/log:/var/log/nginx/
            - ./src:/var/www/html:rw
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        ports:
            - "8001:80"            # 8001 pour éviter le conflit avec Dolibarr (80)
            - "8443:443"           # 8443 pour éviter le conflit avec Dolibarr (443)
        networks:
            - parapente-internal-pod
            - parapente-external-pod
        depends_on:
            - parapente-php

    # ──────────────────────────────────────────
    # PHP 8.4 FPM (app principale)
    # ──────────────────────────────────────────
    parapente-php:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                HOST_UID: ${HOST_UID:-1000}
                HOST_GID: ${HOST_GID:-1000}
        container_name: parapente_php
        volumes:
            - ./src:/var/www/html:rw
            - ./storage:/var/www/storage:rw
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        ports:
            - "6001:9003"          # Xdebug (6001 pour éviter le conflit avec Dolibarr 6000)
        networks:
            - parapente-internal-pod
            - parapente-external-pod
        depends_on:
            parapente-mariadb:
                condition: service_healthy
            parapente-redis:
                condition: service_healthy
        environment:
            - APP_ENV=${APP_ENV:-local}
            - XDEBUG_MODE=${XDEBUG_MODE:-develop,debug}

    # ──────────────────────────────────────────
    # Laravel Queue Worker (jobs météo)
    # ──────────────────────────────────────────
    parapente-worker:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: parapente_worker
        command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120
        volumes:
            - ./src:/var/www/html:rw
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        networks:
            - parapente-internal-pod
            - parapente-external-pod
        depends_on:
            parapente-mariadb:
                condition: service_healthy
            parapente-redis:
                condition: service_healthy
        restart: unless-stopped

    # ──────────────────────────────────────────
    # Redis (cache + queues)
    # ──────────────────────────────────────────
    parapente-redis:
        image: redis:7-alpine
        container_name: parapente_redis
        volumes:
            - redis-parapente:/data
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        networks:
            - parapente-internal-pod
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ──────────────────────────────────────────
    # MailDev (emails de dev)
    # ──────────────────────────────────────────
    parapente-mail:
        image: maildev/maildev
        container_name: parapente_maildev
        ports:
            - "6082:1080"          # Interface web (6082 pour éviter le conflit avec Dolibarr 6081)
            - "1026:1025"          # SMTP (1026 pour éviter le conflit avec Dolibarr 25)
        networks:
            - parapente-internal-pod
            - parapente-external-pod
