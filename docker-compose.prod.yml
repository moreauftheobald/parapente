# /srv/application/docker-compose.prod.yml  — production
#
# Override docker-compose.yml :
#   - Dockerfile.prod (sans Xdebug)
#   - Aucun port exposé (NPM fait le reverse proxy)
#   - phpMyAdmin et MailDev absents
#   - Réseaux externes proxy + meteo-net

networks:
  parapente-internal:
    internal: true
  parapente-external:
    internal: false
  proxy:
    external: true
  meteo-net:
    external: true

services:
  # ────────────────────────────────────────────
  # MariaDB — pas de port exposé en prod
  # ────────────────────────────────────────────
  parapente-mariadb:
    restart: unless-stopped
    networks:
      - parapente-internal

  # ────────────────────────────────────────────
  # phpMyAdmin — désactivé en prod
  # ────────────────────────────────────────────
  parapente-phpmyadmin:
    profiles:
      - dev-only    # jamais démarré sans --profile dev-only explicite

  # ────────────────────────────────────────────
  # Nginx — rejoint le réseau proxy (NPM)
  # ────────────────────────────────────────────
  parapente-nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    ports: !reset []    # supprime les ports 8001/8443 du dev
    networks:
      - parapente-internal
      - proxy
      - meteo-net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # PHP 8.4 FPM — Dockerfile.prod, sans Xdebug
  # ────────────────────────────────────────────
  parapente-php:
    build:
      dockerfile: Dockerfile.prod
    ports: !reset []    # supprime le port Xdebug 6001
    networks:
      - parapente-internal
      - parapente-external
      - meteo-net
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - XDEBUG_MODE=off

  # ────────────────────────────────────────────
  # Queue Worker
  # ────────────────────────────────────────────
  parapente-worker:
    build:
      dockerfile: Dockerfile.prod
    networks:
      - parapente-internal
      - parapente-external
      - meteo-net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # Scheduler
  # ────────────────────────────────────────────
  parapente-scheduler:
    build:
      dockerfile: Dockerfile.prod
    networks:
      - parapente-internal
      - parapente-external
      - meteo-net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # Redis — inchangé
  # ────────────────────────────────────────────
  parapente-redis:
    restart: unless-stopped

  # ────────────────────────────────────────────
  # MailDev — désactivé en prod
  # ────────────────────────────────────────────
  parapente-mail:
    profiles:
      - dev-only