user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 64M;

    # ──────────────────────────────────────────
    # Upstream PHP-FPM
    # ──────────────────────────────────────────
    upstream php-fpm {
        server parapente-php:9000;
    }

    # ──────────────────────────────────────────
    # Server HTTP (dev)
    # ──────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        root /var/www/html/public;
        index index.php index.html;

        charset utf-8;

        # Logs
        access_log /var/log/nginx/parapente_access.log;
        error_log  /var/log/nginx/parapente_error.log;

        # Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        # ── Laravel routing ──────────────────
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── Tampon d'icônes SpotAir ──────────
        # Prend la priorité sur la location regex SVG plus bas (^~) :
        # sert le fichier s'il existe, sinon fallback Laravel pour le
        # générer au premier hit.
        location ^~ /icons-cache/ {
            try_files $uri /index.php?$query_string;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # ── PHP-FPM ──────────────────────────
        location ~ \.php$ {
            fastcgi_pass   php-fpm;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # ── Assets statiques ─────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # ── Sécurité ─────────────────────────
        location ~ /\.ht {
            deny all;
        }

        location ~ /\.env {
            deny all;
        }
    }
}
