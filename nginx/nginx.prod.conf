user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 64M;

    # ──────────────────────────────────────────
    # Sécurité — masquer la version Nginx
    # ──────────────────────────────────────────
    server_tokens off;

    # ──────────────────────────────────────────
    # IP réelle derrière Nginx Proxy Manager
    # NPM tourne sur le même réseau Docker (172.x.x.x)
    # ──────────────────────────────────────────
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ──────────────────────────────────────────
    # Upstream PHP-FPM
    # ──────────────────────────────────────────
    upstream php-fpm {
        server parapente-php:9000;
    }

    # ──────────────────────────────────────────
    # Sidecar consensus-grid : pas de cache nginx
    # ──────────────────────────────────────────
    # Le sidecar Python pré-rend les PNG sur disque en sortie de chaque
    # run horaire (~1330 PNG/run, FileResponse en ~5 ms). Pas besoin de
    # `proxy_cache` au-dessus : l'OS page cache du sidecar et le HTTP
    # cache navigateur (via `Cache-Control: public, max-age=3600` et
    # le cache-buster `?run=<run_init_unix>` côté front) suffisent.
    # On garde juste le `resolver` ci-dessous pour re-résoudre le DNS
    # à chaque requête (sinon `docker compose recreate consensus-grid`
    # gèlerait l'IP côté nginx).

    # ──────────────────────────────────────────
    # Server HTTP (port 80 — SSL géré par NPM)
    # ──────────────────────────────────────────
    server {
        listen 80;
        server_name qui-vole.fr www.qui-vole.fr;

        root /var/www/html/public;
        index index.php index.html;
        charset utf-8;

        # Logs
        access_log /var/log/nginx/parapente_access.log;
        error_log  /var/log/nginx/parapente_error.log;

        # Resolver Docker (127.0.0.11) — pour les `proxy_pass $variable`
        # qui re-résolvent à chaque requête au lieu de geler l'IP au
        # démarrage. `valid=10s` = re-resolve toutes les 10s côté nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;

        # Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript
                   text/xml application/xml application/font-woff application/font-woff2;

        # ── En-têtes de sécurité ──────────────
        add_header X-Frame-Options "SAMEORIGIN"            always;
        add_header X-Content-Type-Options "nosniff"        always;
        add_header X-XSS-Protection "1; mode=block"        always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Laravel routing ───────────────────
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── Tampon d'icônes SpotAir ───────────
        # Prend la priorité sur la location regex SVG plus bas (^~) :
        # sert le fichier s'il existe, sinon fallback Laravel pour le
        # générer au premier hit.
        location ^~ /icons-cache/ {
            try_files $uri /index.php?$query_string;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # ── Carte météo (overlays consensus-grid) ─
        # Reverse proxy simple vers le sidecar (sans cache nginx). Les
        # PNG sont déjà pré-rendus sur disque côté sidecar et servis en
        # ~5 ms via FileResponse + OS page cache. Le navigateur cache
        # ensuite chaque URL pendant 1 h (Cache-Control du sidecar) ;
        # un nouveau run change le `?run=` côté front → URL différente
        # → invalidation naturelle du cache navigateur.
        #
        # `^~` court-circuite la regex \.png$ plus bas qui essaierait
        # sinon de servir un fichier statique inexistant.
        location ^~ /carte-meteo/overlay/ {
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;

            # On strippe le préfixe /carte-meteo/overlay/ pour mapper
            # sur /v1/overlay/{variable}/{step}.png côté sidecar.
            # `proxy_pass` vers une variable → utilise le resolver Docker
            # déclaré plus haut, re-résolution dynamique du DNS.
            rewrite ^/carte-meteo/overlay/(.+)$ /v1/overlay/$1 break;
            set $consensus_grid_upstream "consensus-grid:8082";
            proxy_pass http://$consensus_grid_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            access_log off;
        }

        # ── PHP-FPM ───────────────────────────
        location ~ \.php$ {
            fastcgi_pass   php-fpm;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;

            # Passer le schéma HTTPS depuis NPM à Laravel
            fastcgi_param  HTTPS on;
            fastcgi_param  HTTP_X_FORWARDED_PROTO https;
        }

        # ── Assets statiques ──────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # ── Sécurité ──────────────────────────
        location ~ /\.ht {
            deny all;
        }
        location ~ /\.env {
            deny all;
        }
        location ~ /\.git {
            deny all;
        }
    }
}