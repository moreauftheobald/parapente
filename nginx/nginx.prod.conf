user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 64M;

    # ──────────────────────────────────────────
    # Sécurité — masquer la version Nginx
    # ──────────────────────────────────────────
    server_tokens off;

    # ──────────────────────────────────────────
    # IP réelle derrière Nginx Proxy Manager
    # NPM tourne sur le même réseau Docker (172.x.x.x)
    # ──────────────────────────────────────────
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ──────────────────────────────────────────
    # Upstream PHP-FPM
    # ──────────────────────────────────────────
    upstream php-fpm {
        server parapente-php:9000;
    }

    # ──────────────────────────────────────────
    # Server HTTP (port 80 — SSL géré par NPM)
    # ──────────────────────────────────────────
    server {
        listen 80;
        server_name qui-vole.fr www.qui-vole.fr;

        root /var/www/html/public;
        index index.php index.html;
        charset utf-8;

        # Logs
        access_log /var/log/nginx/parapente_access.log;
        error_log  /var/log/nginx/parapente_error.log;

        # Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript
                   text/xml application/xml application/font-woff application/font-woff2;

        # ── En-têtes de sécurité ──────────────
        add_header X-Frame-Options "SAMEORIGIN"            always;
        add_header X-Content-Type-Options "nosniff"        always;
        add_header X-XSS-Protection "1; mode=block"        always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Laravel routing ───────────────────
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── PHP-FPM ───────────────────────────
        location ~ \.php$ {
            fastcgi_pass   php-fpm;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;

            # Passer le schéma HTTPS depuis NPM à Laravel
            fastcgi_param  HTTPS on;
            fastcgi_param  HTTP_X_FORWARDED_PROTO https;
        }

        # ── Assets statiques ──────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # ── Sécurité ──────────────────────────
        location ~ /\.ht {
            deny all;
        }
        location ~ /\.env {
            deny all;
        }
        location ~ /\.git {
            deny all;
        }
    }
}