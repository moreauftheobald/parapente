user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 64M;

    # ──────────────────────────────────────────
    # Sécurité — masquer la version Nginx
    # ──────────────────────────────────────────
    server_tokens off;

    # ──────────────────────────────────────────
    # IP réelle derrière Nginx Proxy Manager
    # NPM tourne sur le même réseau Docker (172.x.x.x)
    # ──────────────────────────────────────────
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ──────────────────────────────────────────
    # Upstream PHP-FPM
    # ──────────────────────────────────────────
    upstream php-fpm {
        server parapente-php:9000;
    }

    # ──────────────────────────────────────────
    # Upstream sidecar consensus-grid + cache disque
    # ──────────────────────────────────────────
    # Le sidecar Python génère des PNG d'overlays météo à chaque run
    # horaire. Le cache nginx les sert ensuite en sub-ms, et le sidecar
    # n'est sollicité qu'une seule fois par (variable, step) tant que
    # l'entrée reste valide. `proxy_cache_lock` empêche le thundering
    # herd au premier hit (un seul fetch sidecar pour N clients simul-
    # tanés sur la même URL). Cf. `parapente-nginx` dans
    # docker-compose.prod.yml — doit être sur le réseau `meteo-net`.
    upstream consensus-grid {
        server consensus-grid:8082;
    }

    proxy_cache_path /var/cache/nginx/weather levels=1:2 keys_zone=weather:50m
                     max_size=1g inactive=2h use_temp_path=off;

    # ──────────────────────────────────────────
    # Server HTTP (port 80 — SSL géré par NPM)
    # ──────────────────────────────────────────
    server {
        listen 80;
        server_name qui-vole.fr www.qui-vole.fr;

        root /var/www/html/public;
        index index.php index.html;
        charset utf-8;

        # Logs
        access_log /var/log/nginx/parapente_access.log;
        error_log  /var/log/nginx/parapente_error.log;

        # Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript
                   text/xml application/xml application/font-woff application/font-woff2;

        # ── En-têtes de sécurité ──────────────
        add_header X-Frame-Options "SAMEORIGIN"            always;
        add_header X-Content-Type-Options "nosniff"        always;
        add_header X-XSS-Protection "1; mode=block"        always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Laravel routing ───────────────────
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── Tampon d'icônes SpotAir ───────────
        # Prend la priorité sur la location regex SVG plus bas (^~) :
        # sert le fichier s'il existe, sinon fallback Laravel pour le
        # générer au premier hit.
        location ^~ /icons-cache/ {
            try_files $uri /index.php?$query_string;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # ── Carte météo (overlays consensus-grid) ─
        # Cache disque nginx avec proxy_pass direct vers le sidecar
        # (sans passer par PHP). La route reste ouverte — le contenu
        # météo est public par nature et la page admin reste protégée
        # côté Laravel ; un utilisateur non admin n'a pas les URLs.
        #
        # `^~` court-circuite la regex \.png$ plus bas qui essaierait
        # sinon de servir un fichier statique inexistant.
        location ^~ /carte-meteo/overlay/ {
            proxy_cache weather;
            # 30 min < cycle horaire du sidecar → on évite de servir un PNG
            # antérieur au dernier run pendant trop longtemps. Une fois un
            # PNG en cache, ~1 ms par hit.
            proxy_cache_valid 200 30m;
            proxy_cache_valid 404 5s;
            proxy_cache_use_stale updating error timeout;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_ignore_headers Set-Cookie Cache-Control;
            proxy_hide_header Set-Cookie;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=3600" always;

            # On strippe le préfixe /carte-meteo/overlay/ pour mapper
            # sur /v1/overlay/{variable}/{step}.png côté sidecar.
            rewrite ^/carte-meteo/overlay/(.+)$ /v1/overlay/$1 break;
            proxy_pass http://consensus-grid;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            access_log off;
        }

        # ── PHP-FPM ───────────────────────────
        location ~ \.php$ {
            fastcgi_pass   php-fpm;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;

            # Passer le schéma HTTPS depuis NPM à Laravel
            fastcgi_param  HTTPS on;
            fastcgi_param  HTTP_X_FORWARDED_PROTO https;
        }

        # ── Assets statiques ──────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # ── Sécurité ──────────────────────────
        location ~ /\.ht {
            deny all;
        }
        location ~ /\.env {
            deny all;
        }
        location ~ /\.git {
            deny all;
        }
    }
}